
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پیش‌بینی قیمت خانه</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <main class="container">

        <h1>سیستم هوشمند پیش‌بینی قیمت خانه</h1>

        <p class="description">
            اطلاعات خانه را وارد کنید تا قیمت تقریبی آن پیش‌بینی شود.
        </p>

        <form id="prediction-form" novalidate>

            <div class="form-group">
                <label for="area">متراژ خانه (متر مربع)</label>
                <input
                    type="number"
                    id="area"
                    name="area"
                    min="80"
                    max="180"
                    required
                    placeholder="مثلاً 120"
                >
            </div>

            <div class="form-group">
                <label for="rooms">تعداد اتاق‌ها</label>
                <input
                    type="number"
                    id="rooms"
                    name="rooms"
                    min="2"
                    max="5"
                    required
                    placeholder="مثلاً 3"
                >
            </div>

            <div class="form-group">
                <label for="age">سن خانه (سال)</label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    min="1"
                    max="10"
                    required
                    placeholder="مثلاً 5"
                >
            </div>

            <button type="submit">
                محاسبه قیمت خانه
            </button>
            <button type="button" id="reset-button" class="reset-button"> 
                پاک کردن اطلاعات
            </button>
        </form>

        <div id="result" class="result"></div>

    </main>
    <script src="/static/js/app.js"></script>

</body>

</html>
